<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sillazo Legendario — motor de física</title>
  <style>
    :root {
      --bg: #08101b;
      --panel: #111d2a;
      --text: #e8f7ff;
      --accent: #7dff8b;
      --gold: #ffd75e;
      --line: #315266;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 12%, #17364b 0, #0b1826 34%, #05090f 78%);
      color: var(--text);
      font-family: "Courier New", monospace;
    }

    body {
      padding: 18px 12px 40px;
    }

    .wrap {
      width: min(96vw, 1100px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: clamp(18px, 2.6vw, 30px);
      margin: 0 0 4px;
      letter-spacing: 2px;
      color: #c9ffd0;
      text-shadow: 0 3px 0 #15321b;
    }

    .sub {
      font-size: 12px;
      opacity: .7;
      margin: 0 0 12px;
    }

    canvas {
      width: 100%;
      aspect-ratio: 16/9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 4px solid #8de59a;
      border-radius: 4px;
      box-shadow: 0 0 0 4px #173726, 0 24px 70px rgba(0, 0, 0, .55);
      background: #07121f;
      display: block;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 12px;
    }

    .chip {
      background: #101c28;
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      padding: 6px 10px;
      border-radius: 5px;
    }

    details {
      margin: 18px auto 0;
      max-width: 960px;
      text-align: left;
      background: #0d1822;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    summary {
      cursor: pointer;
      padding: 11px 14px;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 10px;
      padding: 0 14px 16px;
    }

    .slot {
      background: #101d29;
      border: 1px solid #24404f;
      border-radius: 5px;
      padding: 9px 10px;
      font-size: 11px;
    }

    .slot b {
      display: block;
      color: #a9e9ff;
      margin-bottom: 2px;
      font-size: 12px;
    }

    .slot span {
      opacity: .6;
    }

    .slot input {
      width: 100%;
      margin-top: 7px;
      font-size: 10px;
      color: #cfe9f5;
    }

    .nota {
      padding: 0 14px 16px;
      font-size: 11px;
      line-height: 1.65;
      opacity: .72;
      max-width: 70ch;
    }

    code {
      background: #16283a;
      padding: 1px 5px;
      border-radius: 3px;
      color: #ffe9a3;
    }

    /* ── Controles Táctiles (Mobile Virtual Gamepad) ── */
    .touch-gamepad {
      display: none;
      width: 100%;
      max-width: 960px;
      margin: 14px auto 0;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /* Visible automáticamente en móviles, tablets y pantallas táctiles */
    @media (pointer: coarse),
    (max-width: 920px) {
      .touch-gamepad {
        display: flex;
      }
    }

    .touch-gamepad.visible {
      display: flex !important;
    }

    .touch-dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: rgba(10, 20, 30, 0.75);
      padding: 8px;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }

    .dpad-row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dpad-center {
      width: 50px;
      height: 50px;
      background: #0d1a26;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #315266;
      font-size: 16px;
      border: 1px solid #1a3344;
    }

    .touch-btn {
      background: #12212f;
      color: var(--text);
      border: 2px solid var(--line);
      border-bottom-width: 4px;
      border-radius: 10px;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.05s ease, background-color 0.05s ease, border-color 0.05s ease;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
    }

    .touch-btn:active,
    .touch-btn.active {
      transform: translateY(2px) scale(0.95);
      border-bottom-width: 2px;
      background: #1b354b;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      color: #ffffff;
    }

    .dpad-btn {
      width: 52px;
      height: 52px;
      font-size: 20px;
      color: #9fe6ff;
    }

    .touch-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-end;
    }

    .touch-sys-btns {
      display: flex;
      gap: 8px;
    }

    .sys-btn {
      padding: 6px 14px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 6px;
      background: #0f1c28;
      border-color: #27485c;
      color: var(--gold);
    }

    .sys-btn:active,
    .sys-btn.active {
      border-color: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .touch-main-btns {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .action-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      font-size: 24px;
      position: relative;
    }

    .action-btn small {
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-top: 2px;
      font-weight: bold;
    }

    .chair-btn {
      width: 86px;
      height: 86px;
      background: #122f20;
      border-color: #3b8b4a;
      color: #c9ffd0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), 0 0 10px rgba(125, 255, 139, 0.25);
    }

    .chair-btn:active,
    .chair-btn.active {
      background: #1a4d31;
      border-color: #7dff8b;
      box-shadow: 0 0 18px #7dff8b;
      color: #ffffff;
    }

    .dash-btn {
      background: #18283a;
      border-color: #3a6888;
      color: #ffe979;
    }

    .dash-btn:active,
    .dash-btn.active {
      background: #23405c;
      border-color: #ffd75e;
      box-shadow: 0 0 16px #ffd75e;
      color: #ffffff;
    }

    .touch-toggle-wrap {
      margin-top: 8px;
      display: flex;
      justify-content: center;
    }

    .touch-toggle-btn {
      background: transparent;
      border: 1px dashed var(--line);
      color: #82a5b8;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .touch-toggle-btn:hover {
      color: var(--gold);
      border-color: var(--gold);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>SILLAZO LEGENDARIO</h1>
    <!--<p class="sub">Motor de física + sprites intercambiables · HTML, Canvas y JavaScript</p>-->

    <canvas id="game" width="960" height="540"></canvas>

    <div class="controls">
      <div class="chip">Mover: WASD / flechas</div>
      <div class="chip">Sillazo: espacio</div>
      <div class="chip">Impulso: shift</div>
      <div class="chip">Empezar: enter</div>
      <div class="chip">Reiniciar: R</div>
      <div class="chip">Ver física: F</div>
    </div>

    <!-- Gamepad Virtual para Móviles / Tablets -->
    <div class="touch-gamepad" id="touchGamepad">
      <!-- D-Pad Direccional -->
      <div class="touch-dpad" id="touchDpad">
        <button class="touch-btn dpad-btn" data-key="arrowup" aria-label="Arriba">▲</button>
        <div class="dpad-row">
          <button class="touch-btn dpad-btn" data-key="arrowleft" aria-label="Izquierda">◀</button>
          <div class="dpad-center">●</div>
          <button class="touch-btn dpad-btn" data-key="arrowright" aria-label="Derecha">▶</button>
        </div>
        <button class="touch-btn dpad-btn" data-key="arrowdown" aria-label="Abajo">▼</button>
      </div>

      <!-- Botones de Acción y Sistema -->
      <div class="touch-actions">
        <div class="touch-sys-btns">
          <button class="touch-btn sys-btn" id="btnTouchStart">EMPEZAR (ENTER)</button>
          <button class="touch-btn sys-btn" id="btnTouchReset">REINICIAR (R)</button>
        </div>
        <div class="touch-main-btns">
          <button class="touch-btn action-btn dash-btn" id="btnTouchDash" aria-label="Impulso">
            <span>⚡</span>
            <small>DASH</small>
          </button>
          <button class="touch-btn action-btn chair-btn" id="btnTouchChair" aria-label="Sillazo">
            <span>🪑</span>
            <small>SILLAZO</small>
          </button>
        </div>
      </div>
    </div>

    <div class="touch-toggle-wrap">
      <button class="touch-toggle-btn" id="btnToggleTouch">🎮 Alternar botones táctiles</button>
    </div>

      const cache = {};                       // cache[id][pose] = [Image, ...]
      function cargar(id, pose, i, src) {
        if (!src) return;
        const img = new Image();
        img.onload = () => {
          (cache[id] = cache[id] || {});
          (cache[id][pose] = cache[id][pose] || [])[i] = img;
        };
        img.src = src;
      }
      for (const id in SPRITES)
        for (const pose in SPRITES[id].poses)
          SPRITES[id].poses[pose].forEach((src, i) => cargar(id, pose, i, src));

      function cuadro(id, pose, t) {

        if (!lista) return null;
        const vivos = lista.filter(Boolean);
        if (!vivos.length) return null;
        const fps = SPRITES[id].fps || 4;
        return vivos[Math.floor(t * fps) % vivos.length];
      }

      /* ── utilidades de dibujo ───────────────────────────────────────── */
      function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, Math.round(w), Math.round(h)); }
      function texto(t, x, y, s = 20, c = "#fff", al = "center") {
        ctx.font = `bold ${s}px "Courier New", monospace`;
        ctx.textAlign = al; ctx.textBaseline = "middle";
        ctx.fillStyle = "#071018"; ctx.fillText(t, x + 2, y + 3);
        ctx.fillStyle = c; ctx.fillText(t, x, y);

      function cuerpo(o) {

      /* ── audio sintetizado (Web Audio API) ──────────────────────────── */
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      }

      function tone(freq, dur, type = "square", vol = 0.05, slide = 0, delay = 0) {
        initAudio();
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(Math.max(20, freq), t0);
        if (slide) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
        }
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur);
      }

      function bip(freq = 440, dur = 0.12, type = "square", vol = 0.08) {
        tone(freq, dur, type, vol, 0);

        heroe.silla.fase = "reposo"; heroe.silla.t = 0; heroe.estela.length = 0;
        nuevosTitanes();
        particulas.length = 0;
        mensaje = "SE ACABÓ LA PELEA ENTRE USTEDES";
        mensajeSub = "¡A SEPARARLOS A SILLAZOS!";
        mensajeT = 260;
        cuentaRegresiva = 3.6;
        cuentaPasoPrevio = -1;
      }

      addEventListener("keydown", e => {
        initAudio();
        const k = e.key.toLowerCase();
        teclas[k] = true;
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
        if (e.key === "Enter") { if (estado === "intro") reiniciar(); else if (estado === "fin") estado = "intro"; }
        if (k === "r") reiniciar();
        if (k === "f") verFisica = !verFisica;
        if (e.code === "Space" && estado === "play" && cuentaRegresiva <= 0.6 && heroe.silla.fase === "reposo") {
          heroe.silla.fase = "carga"; heroe.silla.t = 0; heroe.silla.golpeados.clear();
        }
        if (k === "shift" && estado === "play" && cuentaRegresiva <= 0.6 && heroe.dash <= 0) {
          const m = Math.hypot(heroe.vx, heroe.vy);
          if (m > 20) {
            heroe.vx += heroe.vx / m * 430;
            heroe.vy += heroe.vy / m * 430;
            heroe.dash = .75;
            sonidoDash();
          }
        }
      });
      addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; });

      ["mousedown", "pointerdown", "touchstart"].forEach(evt => {
        window.addEventListener(evt, () => {
          initAudio();
          if (estado === "intro") reiniciar();
          else if (estado === "fin") estado = "intro";
        }, { passive: true });
      });

      /* ── impulsos: todo golpe entra por aquí ────────────────────────── */
      function impulso(c, ix, iy, iz) {
        c.vx += ix / c.masa; c.vy += iy / c.masa; c.vz += (iz || 0) / c.masa;
      }

      function chispas(x, y, z, color, n = 14, fuerza = 200) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, s = fuerza * (.3 + Math.random());
          particulas.push({
            x, y, z, vx: Math.cos(a) * s, vy: Math.sin(a) * s * .55, vz: Math.random() * 260 + 60,
            vida: .45 + Math.random() * .55, max: 1, color, t: 2 + Math.random() * 4
          });
        }
      }

      /* ── la silla: arco angular real ────────────────────────────────── */
      const SILLA = { carga: .10, golpe: .14, vuelta: .20, radio: 66, reposo: -.55, atras: -2.35, fin: .95 };
      const suave = t => t * t * (3 - 2 * t);

      function puntaSilla(ang) {
        return {
          x: heroe.x + Math.cos(ang) * SILLA.radio * heroe.mirando,
          y: heroe.y - 26 - heroe.z + Math.sin(ang) * SILLA.radio
        };
      }

      function actualizarSilla() {
        const s = heroe.silla;
        if (s.fase === "reposo") { s.angPrev = s.ang; s.ang = SILLA.reposo; return; }
        s.t += DT;
        s.angPrev = s.ang;
        if (s.fase === "carga") {
          s.ang = SILLA.reposo + (SILLA.atras - SILLA.reposo) * suave(clamp(s.t / SILLA.carga, 0, 1));
          if (s.t >= SILLA.carga) { s.fase = "golpe"; s.t = 0; sonidoSwoosh(); }
        } else if (s.fase === "golpe") {
          const p = clamp(s.t / SILLA.golpe, 0, 1);
          s.ang = SILLA.atras + (SILLA.fin - SILLA.atras) * (p * p);   // acelera al final
          revisarGolpe();
          if (s.t >= SILLA.golpe) { s.fase = "vuelta"; s.t = 0; }
        } else {
          s.ang = SILLA.fin + (SILLA.reposo - SILLA.fin) * suave(clamp(s.t / SILLA.vuelta, 0, 1));
          if (s.t >= SILLA.vuelta) { s.fase = "reposo"; s.t = 0; }
        }

        const p = puntaSilla(s.ang);
        heroe.estela.push({ x: p.x, y: p.y, vida: .22 });
        if (heroe.estela.length > 14) heroe.estela.shift();
      }

      function revisarGolpe() {
        const s = heroe.silla;
        const a = puntaSilla(s.angPrev), b = puntaSilla(s.ang);
        // velocidad de la punta: de ahí sale la fuerza del sillazo
        const velPunta = Math.hypot(b.x - a.x, b.y - a.y) / DT;
        const p = clamp(s.t / SILLA.golpe, 0, 1);
        if (p < .42) return;                            // todavía viene subiendo: no hay fuerza
        const alcance = 24 + SILLA.radio * (.5 + .5 * p);  // la silla se extiende al girar

        for (const t of titanes) {
          if (t.hp <= 0 || s.golpeados.has(t)) continue;

          // el impacto se resuelve en el plano del suelo: y es profundidad, no altura
          const rx = t.x - heroe.x, ry = (t.y - heroe.y) * 1.45;
          const d = Math.hypot(rx, ry);
          if (d > alcance + t.radio) continue;
          if (Math.abs(t.z - heroe.z) > 120) continue;
          if (d > 1 && (rx / d) * heroe.mirando < -.45) continue;   // solo el lado que mira

          s.golpeados.add(t);
          t.hp = Math.max(0, t.hp - 18);
          t.destello = .14; t.aturdido = .55;
          sonidoImpactoSilla();

          // dirección: lo aleja del héroe, con sesgo hacia donde mira
          const sl = d || 1;
          let dx = (rx / sl) * .7 + heroe.mirando * .3;
          let dy = ((t.y - heroe.y) / sl) * .7;
          const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
          const J = clamp(velPunta * 1.15, 1100, 3400);   // impulso proporcional al barrido
          impulso(t, dx * J, dy * J * .55, J * .6);

          // tercera ley: el héroe también retrocede
          impulso(heroe, -dx * J * .16, -dy * J * .1, 0);

          chispas(t.x, t.y, t.z + 40, "#fff3a0", 22, 320);
          sacudida = 15; congelado = .075; destelloPantalla = .06;
          mensaje = ["¡SILLAZO!", "¡CLANK!", "¡PAZ POR LAS MALAS!", "¡TOMA ACERO!"][(Math.random() * 4) | 0];
          mensajeSub = "";
          mensajeT = 40;
        }
      }

      /* ── integración de un cuerpo ───────────────────────────────────── */
      function integrar(c, vuela) {
        c.vz -= GRAVEDAD * DT;
        c.z += c.vz * DT;

        const piso = vuela ? 0 : 0;
        if (c.z <= piso) {
          c.z = piso;
          if (c.vz < -140) {                       // aterrizaje con rebote
            c.vz = -c.vz * REBOTE;
            chispas(c.x, c.y, 0, "#8aa6b5", 8, 130);
            sacudida = Math.max(sacudida, 6);
          } else c.vz = 0;
          c.enSuelo = true;
        } else c.enSuelo = false;

        if (vuela) {                               // muelle hacia la altura de vuelo
          const k = 46, amort = 7.4;
          c.vz += (c.zVuelo - c.z) * k * DT - c.vz * amort * DT + GRAVEDAD * DT;
          c.enSuelo = false;
        }

        c.x += c.vx * DT;
        c.y += c.vy * DT;

        const roce = c.enSuelo || vuela ? ROCE_SUELO : ROCE_AIRE;
        const f = Math.exp(-roce * DT);
        c.vx *= f; c.vy *= f;

        // paredes con rebote
        const bx = 52, by0 = SUELO_ALTO, by1 = SUELO_BAJO;
        if (c.x < bx) { c.x = bx; c.vx = Math.abs(c.vx) * .5; }
        if (c.x > W - bx) { c.x = W - bx; c.vx = -Math.abs(c.vx) * .5; }
        if (c.y < by0) { c.y = by0; c.vy = Math.abs(c.vy) * .5; }
        if (c.y > by1) { c.y = by1; c.vy = -Math.abs(c.vy) * .5; }

        if (c.aturdido > 0) c.aturdido -= DT;
        if (c.destello > 0) c.destello -= DT;
        if (c.atacando > 0) c.atacando -= DT;
        c.animT += DT;
      }

      /* ── colisión entre cuerpos, repartida por masa ─────────────────── */
      function resolver(a, b) {
        if (a.hp <= 0 || b.hp <= 0) return;
        const dx = b.x - a.x, dy = (b.y - a.y) * 1.6;       // el eje de profundidad pesa menos
        const d = Math.hypot(dx, dy) || 1;
        const min = a.radio + b.radio;
        if (d >= min) return;

        const nx = dx / d, ny = dy / d, solape = min - d;
        const total = a.masa + b.masa;
        a.x -= nx * solape * (b.masa / total); a.y -= ny * solape * (b.masa / total) / 1.6;
        b.x += nx * solape * (a.masa / total); b.y += ny * solape * (a.masa / total) / 1.6;

        const vrel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vrel > 0) return;
        const j = -(1.35) * vrel / (1 / a.masa + 1 / b.masa);
        impulso(a, -j * nx, -j * ny, 0);
        impulso(b, j * nx, j * ny, 0);
        if (Math.abs(vrel) > 230) {
          chispas((a.x + b.x) / 2, (a.y + b.y) / 2, 40, "#ffd0a0", 10, 180);
          sacudida = Math.max(sacudida, 8);
        }
      }

      /* ── IA con inercia: fuerzas, no teletransporte ─────────────────── */
      function pensarTitan(t, otro) {
        if (t.hp <= 0 || t.aturdido > 0) return;
        const ACEL = 1250, TOPE = 210;

        // si el otro titán sigue en pie y está cerca, se pelean entre ellos
        let objetivo = heroe;
        if (otro && otro.hp > 0) {
          const dRival = Math.hypot(otro.x - t.x, otro.y - t.y);
          const dHeroe = Math.hypot(heroe.x - t.x, heroe.y - t.y);
          if (dRival < dHeroe * 1.25) objetivo = otro;
        }

        let dx = objetivo.x - t.x, dy = objetivo.y - t.y;
        const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
        if (Math.abs(dx) > .25) t.mirando = dx > 0 ? 1 : -1;   // mira a quien persigue

        // vaivén lateral para que no vayan en línea recta
        const bal = Math.sin(tiempo * 1.7 + t.x * .01) * .45;
        const ax = dx + (-dy) * bal, ay = dy + dx * bal;

        t.vx += ax * ACEL * DT;
        t.vy += ay * ACEL * DT;
        const v = Math.hypot(t.vx, t.vy);
        if (v > TOPE) { t.vx = t.vx / v * TOPE; t.vy = t.vy / v * TOPE; }

        // embestida al contacto
        if (objetivo === heroe && d < t.radio + heroe.radio + 14 && heroe.inv <= 0) {
          heroe.hp = Math.max(0, heroe.hp - 8);
          heroe.inv = .75; t.atacando = .45;
          impulso(heroe, dx * 1500, dy * 900, 620);
          chispas(heroe.x, heroe.y, heroe.z + 30, "#ff8d90", 16, 260);
          sacudida = 12; congelado = .05;
          mensaje = "¡TE EMBISTIÓ!"; mensajeSub = ""; mensajeT = 34;
          sonidoHurt();
        } else if (objetivo !== heroe && d < t.radio + objetivo.radio + 10) {
          impulso(t, -dx * 700, -dy * 400, 240);
          impulso(objetivo, dx * 700, dy * 400, 240);
          if (t.atacando <= 0) {
            t.atacando = 0.55; // cooldown de choque entre titanes
            objetivo.hp = Math.max(0, objetivo.hp - 1);
            t.hp = Math.max(0, t.hp - 1);
            chispas((t.x + objetivo.x) / 2, (t.y + objetivo.y) / 2, 60, "#ffe08a", 10, 220);
            sonidoChoqueTitan();
          }
        }
      }

      /* ── paso de simulación ─────────────────────────────────────────── */
      function simular() {
        tiempo += DT; frame++;
        if (congelado > 0) { congelado -= DT; return; }   // hit-stop
        if (estado !== "play") { moverParticulas(); return; }

        if (cuentaRegresiva > 0) {
          cuentaRegresiva -= DT;
          let paso = 0;
          if (cuentaRegresiva > 2.6) paso = 3;
          else if (cuentaRegresiva > 1.6) paso = 2;
          else if (cuentaRegresiva > 0.6) paso = 1;
          else paso = 0;

          if (paso !== cuentaPasoPrevio) {
            cuentaPasoPrevio = paso;
            if (paso === 3) {
              bip(440, 0.14, "square", 0.08);
              chispas(W / 2, 295, 20, "#4aa8ff", 16, 240);
              sacudida = 4;
            } else if (paso === 2) {
              bip(520, 0.14, "square", 0.08);
              chispas(W / 2, 295, 20, "#ffd75e", 16, 240);
              sacudida = 4;
            } else if (paso === 1) {
              bip(620, 0.14, "square", 0.08);
              chispas(W / 2, 295, 20, "#ff6c73", 16, 240);
              sacudida = 5;
            } else if (paso === 0) {
              bipGo();
              chispas(W / 2, 295, 20, "#7dff8b", 30, 380);
              destelloPantalla = 0.12;
              sacudida = 10;
            }
          }

          // Durante 3, 2, 1 (antes de ¡YA!) los personajes flotan listos para la acción
          if (cuentaRegresiva > 0.6) {
            heroe.zVuelo = 46 + Math.sin(tiempo * 2.3) * 7;
            integrar(heroe, true);
            for (const t of titanes) {
              t.mirando = t.x < heroe.x ? 1 : -1;
              integrar(t, false);
            }
            moverParticulas();
            if (mensajeT > 0) mensajeT--;
            sacudida *= .88; if (sacudida < .4) sacudida = 0;
            if (destelloPantalla > 0) destelloPantalla -= DT;
            return;
          }
        }

        let ix = 0, iy = 0;
        if (teclas["arrowleft"] || teclas["a"]) ix--;
        if (teclas["arrowright"] || teclas["d"]) ix++;
        if (teclas["arrowup"] || teclas["w"]) iy--;
        if (teclas["arrowdown"] || teclas["s"]) iy++;
        if (ix || iy) {
          const l = Math.hypot(ix, iy);
          heroe.vx += ix / l * 1900 * DT;
          heroe.vy += iy / l * 1500 * DT;
          // la orientación la manda el mando, no el empujón: si no, el retroceso
          // del sillazo voltearía al héroe justo al golpear
          if (ix && heroe.silla.fase === "reposo") heroe.mirando = ix > 0 ? 1 : -1;
        }
        const vm = Math.hypot(heroe.vx, heroe.vy), TOPE = 305;
        if (vm > TOPE && heroe.dash <= 0) { heroe.vx = heroe.vx / vm * TOPE; heroe.vy = heroe.vy / vm * TOPE; }
        if (heroe.dash > 0) heroe.dash -= DT;
        if (heroe.inv > 0) heroe.inv -= DT;

        heroe.zVuelo = 46 + Math.sin(tiempo * 2.3) * 7;    // flotación
        integrar(heroe, true);
        actualizarSilla();

        for (const t of titanes) {
          if (t.hp <= 0) continue;
          pensarTitan(t, titanes.find(o => o !== t));
          integrar(t, false);
        }
        for (let i = 0; i < titanes.length; i++)
          for (let j = i + 1; j < titanes.length; j++) resolver(titanes[i], titanes[j]);
        for (const t of titanes) resolver(heroe, t);

        moverParticulas();
        if (mensajeT > 0) mensajeT--;
        sacudida *= .88; if (sacudida < .4) sacudida = 0;
        if (destelloPantalla > 0) destelloPantalla -= DT;

        if (heroe.hp <= 0) {
          estado = "fin"; resultado = "DERROTA";
          sonidoDerrota();
        } else if (titanes.every(t => t.hp <= 0)) {
          estado = "fin"; resultado = "PAZ RESTAURADA";
          sonidoVictoria();
        }
      }

      function moverParticulas() {
        for (let i = particulas.length - 1; i >= 0; i--) {
          const p = particulas[i];
          p.vz -= GRAVEDAD * DT; p.z += p.vz * DT;
          p.x += p.vx * DT; p.y += p.vy * DT;
          if (p.z < 0) { p.z = 0; p.vz = -p.vz * .35; p.vx *= .6; p.vy *= .6; }
          p.vida -= DT;
          if (p.vida <= 0) particulas.splice(i, 1);
        }
      }

      /* ── dibujo de sprites y placeholders ───────────────────────────── */
      function escalaProf(y) { return .93 + (clamp(y, SUELO_ALTO, SUELO_BAJO) - SUELO_ALTO) / (SUELO_BAJO - SUELO_ALTO) * .15; }

      function sombra(c) {
        const e = escalaProf(c.y);
        const enc = clamp(1 - c.z / 240, .18, 1);
        ctx.save();
        ctx.globalAlpha = .34 * enc;
        ctx.fillStyle = "#02080c";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.radio * 1.05 * e * enc, c.radio * .36 * e * enc, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function dibujarCuerpo(c, pose) {
        const cfg = SPRITES[c.sprite];
        const e = escalaProf(c.y);
        const w = cfg.ancho * e, h = cfg.alto * e;
        const px = c.x - w * cfg.ancla.x;
        const py = (c.y - c.z) - h * cfg.ancla.y;
        const img = cuadro(c.sprite, pose, c.animT) || cuadro(c.sprite, "idle", c.animT);

        ctx.save();
        // inclinación según la velocidad: da sensación de peso
        const inc = clamp(c.vx / 1900, -.12, .12);
        ctx.translate(c.x, c.y - c.z);
        ctx.rotate(inc);
        ctx.translate(-c.x, -(c.y - c.z));

        if (img) {
          // el arte mira a la derecha: se voltea sobre el eje del propio cuerpo
          if (c.mirando < 0) { ctx.translate(c.x * 2, 0); ctx.scale(-1, 1); }
          ctx.drawImage(img, px | 0, py | 0, Math.round(w), Math.round(h));
          if (c.destello > 0) {
            ctx.globalCompositeOperation = "lighter";
            ctx.globalAlpha = .8;
            ctx.drawImage(img, px | 0, py | 0, Math.round(w), Math.round(h));
            ctx.globalCompositeOperation = "source-over";
            ctx.globalAlpha = 1;
          }
        } else {
          placeholder(cfg, pose, px, py, w, h, c);
        }
        ctx.restore();
      }

      /* ── qué pose toca según el estado físico ───────────────────────── */
      function poseHeroe() {
        if (heroe.hp <= 0) return "ko";
        if (heroe.inv > .45) return "aturdido";
        const s = heroe.silla;
        if (s.fase === "carga") return "carga";
        if (s.fase === "golpe") return (s.t / SILLA.golpe) < .55 ? "golpe" : "impacto";
        if (s.fase === "vuelta") return "barrido";
        return "idle";
      }
      function poseTitan(t) {
        if (t.aturdido > 0) return "aturdido";
        if (t.atacando > 0) return "ataque";
        return Math.hypot(t.vx, t.vy) > 145 ? "correr" : "idle";
      }

      function placeholder(cfg, pose, px, py, w, h, c) {
        const col = c && c.destello > 0 ? "#ffffff" : cfg.color;
        ctx.save();
        ctx.globalAlpha = .13; rect(px, py, w, h, col); ctx.globalAlpha = 1;
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
        ctx.strokeRect((px | 0) + 1, (py | 0) + 1, Math.round(w) - 2, Math.round(h) - 2);
        ctx.setLineDash([]);

        // esquinas sólidas: marcan el encuadre exacto
        const k = 9;
        rect(px, py, k, 3, col); rect(px, py, 3, k, col);
        rect(px + w - k, py, k, 3, col); rect(px + w - 3, py, 3, k, col);
        rect(px, py + h - 3, k, 3, col); rect(px, py + h - k, 3, k, col);
        rect(px + w - k, py + h - 3, k, 3, col); rect(px + w - 3, py + h - k, 3, k, col);

        texto(cfg.nombre, px + w / 2, py + h / 2 - 13, 13, col);
        texto(pose, px + w / 2, py + h / 2 + 4, 11, "#dff3ff");
        texto(`${cfg.ancho}×${cfg.alto}`, px + w / 2, py + h / 2 + 20, 10, "rgba(230,246,255,.55)");

        // cruz de anclaje
        const ax = px + w * cfg.ancla.x, ay = py + h * cfg.ancla.y;
        rect(ax - 8, ay - 1, 16, 2, "#ffd75e"); rect(ax - 1, ay - 8, 2, 16, "#ffd75e");

        // flecha de orientación
        if (c && pose !== "espalda") {
          const d = c.mirando;
          ctx.globalAlpha = .75;
          rect(ax + d * 20 - 4, ay - h * .55, 8, 3, col);
          rect(ax + d * 26 - 4, ay - h * .55 - 3, 3, 9, col);
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function dibujarSilla() {
        const s = heroe.silla;
        // estela del barrido
        for (let i = 0; i < heroe.estela.length; i++) {
          const e = heroe.estela[i];
          ctx.globalAlpha = (i / heroe.estela.length) * .4;
          rect(e.x - 2, e.y - 2, 5, 5, "#dff6ff");
        }
        ctx.globalAlpha = 1;

        const p = puntaSilla(s.ang);
        ctx.save();
        ctx.translate(p.x | 0, p.y | 0);
        ctx.rotate(s.ang * heroe.mirando + (heroe.mirando < 0 ? Math.PI : 0));
        const esc = 1.7 * escalaProf(heroe.y);
        ctx.scale(esc, esc);
        const metal = "#c6d0d7", borde = "#67757f", brillo = "#f5fbff";
        rect(-9, -15, 18, 4, borde); rect(-8, -14, 16, 2, metal); rect(-6, -14, 5, 1, brillo);
        rect(-8, -10, 16, 12, borde); rect(-7, -9, 14, 10, metal);
        rect(-9, 3, 18, 4, borde); rect(-8, 4, 16, 2, metal);
        rect(-8, 7, 3, 14, borde); rect(5, 7, 3, 14, borde);
        rect(-7, 7, 1, 13, brillo); rect(6, 7, 1, 13, brillo);
        ctx.restore();
      }

      /* ── fondo ──────────────────────────────────────────────────────── */
      function fondo() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "#102b42"); g.addColorStop(.55, "#102132"); g.addColorStop(1, "#071018");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

        ctx.globalAlpha = .16; ctx.fillStyle = "#b9ecff";
        ctx.beginPath(); ctx.arc(W / 2, 86, 120, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#122a35";
        ctx.beginPath();
        ctx.moveTo(0, 310); ctx.lineTo(120, 168); ctx.lineTo(210, 290); ctx.lineTo(330, 148);
        ctx.lineTo(470, 310); ctx.lineTo(610, 164); ctx.lineTo(790, 300); ctx.lineTo(900, 198);
        ctx.lineTo(960, 268); ctx.lineTo(960, 540); ctx.lineTo(0, 540); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#0b1a22";
        ctx.beginPath();
        ctx.moveTo(0, 372); ctx.lineTo(170, 244); ctx.lineTo(320, 364); ctx.lineTo(480, 258);
        ctx.lineTo(650, 374); ctx.lineTo(820, 248); ctx.lineTo(960, 344); ctx.lineTo(960, 540);
        ctx.lineTo(0, 540); ctx.closePath(); ctx.fill();

        rect(0, SUELO_ALTO - 8, W, H, "#13282a");
        for (let y = SUELO_ALTO; y < H; y += 18)
          for (let x = (y % 36); x < W; x += 36)
            rect(x, y, 18, 9, (x / 18 + y / 9) % 4 < 2 ? "#173336" : "#102729");
      }

      function tormenta() {
        for (const r of lluvia) {
          rect(r.x, r.y, 2, r.s, "rgba(164,224,255,.36)");
          r.y += 260 * DT * 1.6; r.x -= 96 * DT * 1.6;
          if (r.y > H) { r.y = -10; r.x = Math.random() * W; }
          if (r.x < 0) r.x = W;
        }
        if (frame % 150 === 0) {
          destelloPantalla = Math.max(destelloPantalla, .05);
          sonidoTrueno();
        }
      }

      /* ── depuración ─────────────────────────────────────────────────── */
      function debug() {
        ctx.save();
        ctx.lineWidth = 1;
        const todos = [heroe, ...titanes];
        for (const c of todos) {
          if (c.hp <= 0) continue;
          ctx.strokeStyle = "rgba(125,255,139,.6)";
          ctx.beginPath(); ctx.ellipse(c.x, c.y, c.radio, c.radio / 1.6, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.strokeStyle = "rgba(255,215,94,.9)";
          ctx.beginPath(); ctx.moveTo(c.x, c.y - c.z);
          ctx.lineTo(c.x + c.vx * .16, c.y - c.z + c.vy * .16); ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,.25)";
          ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x, c.y - c.z); ctx.stroke();
          texto(`v ${Math.hypot(c.vx, c.vy) | 0}  z ${c.z | 0}`, c.x, c.y + 16, 10, "#9fe6ff");
        }
        const s = heroe.silla, a = puntaSilla(s.angPrev), b = puntaSilla(s.ang);
        ctx.strokeStyle = "rgba(255,120,120,.9)";
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        texto(`fase ${s.fase}`, 80, H - 18, 11, "#ffd75e", "left");
        ctx.restore();
      }

      /* ── HUD ────────────────────────────────────────────────────────── */
      function barra(x, y, w, h, v, label, color) {
        rect(x - 2, y - 2, w + 4, h + 4, "#061018");
        rect(x, y, w, h, "#39242c");
        rect(x, y, w * (v / 100), h, color);
        texto(label, x + w / 2, y - 13, 12, "#eafff0");
      }

      function dibujarBannerMensaje() {
        if (mensajeT <= 0) return;
        const op = clamp(mensajeT / 18, 0, 1);
        ctx.save();
        ctx.globalAlpha = op;

        const bx = W / 2;
        const esIntro = cuentaRegresiva > 0;
        const by = esIntro ? 122 : 112;
        const bw = esIntro ? 660 : 420;
        const bh = esIntro ? 58 : 38;

        // Fondo panel de vidrio oscuro
        rect(bx - bw / 2, by - bh / 2, bw, bh, "rgba(4, 13, 20, 0.92)");

        // Borde brillante de estilo arcade
        ctx.strokeStyle = esIntro ? "#ffd75e" : "#7dff8b";
        ctx.lineWidth = 2;
        ctx.strokeRect(bx - bw / 2, by - bh / 2, bw, bh);

        ctx.strokeStyle = "#27485c";
        ctx.lineWidth = 1;
        ctx.strokeRect(bx - bw / 2 + 3, by - bh / 2 + 3, bw - 6, bh - 6);

        // Remaches / esquinas doradas
        const k = 6;
        const colEsquina = esIntro ? "#ffd75e" : "#7dff8b";
        rect(bx - bw / 2, by - bh / 2, k, 2, colEsquina);
        rect(bx - bw / 2, by - bh / 2, 2, k, colEsquina);
        rect(bx + bw / 2 - k, by - bh / 2, k, 2, colEsquina);
        rect(bx + bw / 2 - 2, by - bh / 2, 2, k, colEsquina);
        rect(bx - bw / 2, by + bh / 2 - 2, k, 2, colEsquina);
        rect(bx - bw / 2, by + bh / 2 - k, 2, k, colEsquina);
        rect(bx + bw / 2 - k, by + bh / 2 - 2, k, 2, colEsquina);
        rect(bx + bw / 2 - 2, by + bh / 2 - k, 2, k, colEsquina);

        if (esIntro) {
          // Pestaña superior decorativa
          rect(bx - 125, by - bh / 2 - 9, 250, 13, "#ffd75e");
          texto("⚡ RAYQUAZA INTERVIENE ⚡", bx, by - bh / 2 - 2, 10, "#08131d");

          // Texto principal de pacificación
          texto(mensaje, bx, by - (mensajeSub ? 5 : 0), 18, "#ffffff");
          if (mensajeSub) {
            texto(mensajeSub, bx, by + 16, 12, "#7dff8b");
          }
        } else {
          // Mensaje de combate rápido
          texto(mensaje, bx, by, 16, "#fff0a5");
        }

        ctx.restore();
      }

      function dibujarCuentaRegresiva() {
        if (cuentaRegresiva <= 0) return;

        const cx = W / 2, cy = 295;
        ctx.save();

        let txt = "", col = "#fff", subTxt = "";
        let tPaso = 0; // progreso del segundo [1..0]

        if (cuentaRegresiva > 2.6) {
          txt = "3";
          col = "#4aa8ff";
          subTxt = "¡PREPÁRATE!";
          tPaso = (cuentaRegresiva - 2.6) / 1.0;
        } else if (cuentaRegresiva > 1.6) {
          txt = "2";
          col = "#ffd75e";
          subTxt = "¡AJUSTA LA SILLA!";
          tPaso = (cuentaRegresiva - 1.6) / 1.0;
        } else if (cuentaRegresiva > 0.6) {
          txt = "1";
          col = "#ff6c73";
          subTxt = "¡POSICIÓN DE COMBATE!";
          tPaso = (cuentaRegresiva - 0.6) / 1.0;
        } else {
          txt = "¡A REPARTIR SILLAZOS!";
          col = "#7dff8b";
          subTxt = "¡SEPARACIÓN POR LA FUERZA!";
          tPaso = cuentaRegresiva / 0.6;
        }

        // Animación de pop-in con escala suave
        const escala = 1.0 + Math.pow(tPaso, 2) * 0.75;

        // Anillos de energía expansivos
        const rAro = (1 - tPaso) * 90 + 35;
        ctx.globalAlpha = 0.45 * (1 - tPaso * 0.6);
        ctx.strokeStyle = col;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, rAro, 0, Math.PI * 2);
        ctx.stroke();

        // Fondo circular oscurecido tipo badge arcade
        ctx.globalAlpha = 0.82;
        ctx.fillStyle = "#06131c";
        ctx.beginPath();
        ctx.arc(cx, cy, 64, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(escala, escala);

        if (txt.length === 1) {
          // Número 3, 2, 1
          texto(txt, 0, -2, 78, col);
          texto(subTxt, 0, 48, 13, "#dff7ff");
        } else {
          // Cartel ¡A REPARTIR SILLAZOS!
          rect(-220, -28, 440, 56, "rgba(5, 18, 25, 0.95)");
          ctx.strokeStyle = "#7dff8b";
          ctx.lineWidth = 3;
          ctx.strokeRect(-220, -28, 440, 56);
          texto(txt, 0, -5, 23, "#7dff8b");
          texto(subTxt, 0, 16, 12, "#ffe979");
        }

        ctx.restore();
        ctx.restore();
      }

      function escena() {
        fondo(); tormenta();

        ctx.globalAlpha = .5;
        for (let i = 0; i < 9; i++) rect(80 + i * 110, 452 + (i % 2) * 26, 64, 5, "#1e4d45");
        ctx.globalAlpha = 1;

        const orden = [];
        for (const t of titanes) if (t.hp > 0) orden.push({ y: t.y, c: t, pose: poseTitan(t) });
        orden.push({ y: heroe.y, c: heroe, pose: poseHeroe(), heroe: true });
        orden.sort((a, b) => a.y - b.y);

        for (const o of orden) sombra(o.c);
        for (const o of orden) {
          if (o.heroe) {
            const parpadeo = heroe.inv > 0 && Math.floor(heroe.inv * 14) % 2 === 0;
            if (!parpadeo) dibujarCuerpo(heroe, o.pose);
            // el arte ya lleva la silla en la mano; el dibujo por código
            // solo se usa cuando el hueco está vacío
            if (!hayArte("heroe")) dibujarSilla();
          } else dibujarCuerpo(o.c, o.pose);
        }

        for (const p of particulas) {
          ctx.globalAlpha = clamp(p.vida / p.max, 0, 1);
          rect(p.x, p.y - p.z, p.t, p.t, p.color);
        }
        ctx.globalAlpha = 1;

        if (verFisica) debug();

        rect(18, 15, 924, 72, "rgba(4,12,18,.80)");
        barra(38, 52, 240, 14, heroe.hp, SPRITES.heroe.nombre, "#52df68");
        barra(360, 52, 220, 14, titanes[0].hp, SPRITES.titanA.nombre, "#4aa8ff");
        barra(684, 52, 220, 14, titanes[1].hp, SPRITES.titanB.nombre, "#f15a52");

        if (estado === "play") {
          dibujarBannerMensaje();
          dibujarCuentaRegresiva();
        }
      }

      function intro() {
        fondo(); tormenta();

        // los dos titanes chocando al fondo, movidos por la misma física
        for (const t of titanes) {
          t.y = 320; t.z = Math.max(0, Math.sin(tiempo * 3 + t.x) * 18);
          sombra(t);
          dibujarCuerpo(t, "ataque");
        }
        if ((frame % 90) < 12) {
          rect(W / 2 - 3, 175, 6, 150, "rgba(255,247,173,.45)");
          rect(W / 2 - 18, 232, 36, 4, "rgba(255,247,173,.38)");
        }

        // el héroe de espaldas, en primer plano
        const guardado = { x: heroe.x, y: heroe.y, z: heroe.z };
        heroe.x = W / 2; heroe.y = 470; heroe.z = 40 + Math.sin(tiempo * 1.8) * 9;
        sombra(heroe);
        dibujarCuerpo(heroe, "frontal");
        Object.assign(heroe, guardado);

        rect(0, 486, W, 54, "#050b0f");
        texto("DOS TITANES HAN VUELTO A PELEAR...", W / 2, 62, 23, "#dff7ff");
        texto("Y ALGUIEN YA PERDIÓ LA PACIENCIA.", W / 2, 93, 19, "#7dff8b");
        if (Math.floor(frame / 35) % 2 === 0) {
          rect(W / 2 - 210, 458, 420, 36, "rgba(3,10,14,.82)");
          texto("PULSA ENTER PARA SACAR LA SILLA", W / 2, 476, 17, "#ffe66d");
        }
      }

      function fin() {
        escena();
        rect(0, 0, W, H, "rgba(2,7,12,.72)");
        rect(170, 150, 620, 235, "#0b1720");
        rect(177, 157, 606, 221, "#142834");
        if (resultado === "PAZ RESTAURADA") {
          texto("PAZ RESTAURADA", W / 2, 205, 34, "#7dff8b");
          texto("LOS DOS ENTENDIERON EL MENSAJE.", W / 2, 257, 17, "#e9fbff");
          texto("LA SILLA, LAMENTABLEMENTE, NO SOBREVIVIÓ.", W / 2, 288, 15, "#ffe979");
        } else {
          texto("QUEDASTE KO", W / 2, 212, 32, "#ff6c73");
          texto("NI UNA SILLA METÁLICA PUDO CON TANTO CAOS.", W / 2, 268, 16, "#edf8ff");
        }
        texto("ENTER: INTRO  ·  R: REINTENTAR", W / 2, 354, 14, "#a9cfe1");
      }

      /* ── bucle con paso fijo ────────────────────────────────────────── */
      let ultimo = performance.now(), acumulado = 0;
      function bucle(ahora) {
        requestAnimationFrame(bucle);
        let delta = (ahora - ultimo) / 1000; ultimo = ahora;
        if (delta > .25) delta = .25;
        acumulado += delta;
        while (acumulado >= DT) { simular(); acumulado -= DT; }

        const sx = sacudida ? (Math.random() - .5) * sacudida : 0;
        const sy = sacudida ? (Math.random() - .5) * sacudida : 0;
        ctx.save(); ctx.translate(sx, sy);
        if (estado === "intro") intro();
        else if (estado === "play") escena();
        else fin();
        ctx.restore();

        if (destelloPantalla > 0) {
          ctx.globalAlpha = clamp(destelloPantalla * 4, 0, .3);
          rect(0, 0, W, H, "#dff8ff");
          ctx.globalAlpha = 1;
        }
      }

      /* ── soporte táctil / mobile gamepad ────────────────────────────── */
      function configurarControlesTactiles() {
        const gamepad = document.getElementById("touchGamepad");
        const btnToggle = document.getElementById("btnToggleTouch");
        if (btnToggle && gamepad) {
          btnToggle.addEventListener("click", () => {
            gamepad.classList.toggle("visible");
          });
        }

        // Si es dispositivo táctil, asegurar que se muestre
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
          if (gamepad) gamepad.classList.add("visible");
        }

        // Manejador para botones del D-Pad con soporte continuo
        function vincularBotonTecla(btn, keyName) {
          if (!btn) return;
          const activar = (e) => {
            if (e.cancelable) e.preventDefault();
            initAudio();
            teclas[keyName] = true;
            btn.classList.add("active");
            if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) { }
          };
          const desactivar = (e) => {
            if (e.cancelable) e.preventDefault();
            teclas[keyName] = false;
            btn.classList.remove("active");
          };

          btn.addEventListener("pointerdown", activar, { passive: false });
          btn.addEventListener("pointerup", desactivar, { passive: false });
          btn.addEventListener("pointercancel", desactivar, { passive: false });
          btn.addEventListener("pointerleave", desactivar, { passive: false });
        }

        document.querySelectorAll(".dpad-btn").forEach(btn => {
          const k = btn.getAttribute("data-key");
          if (k) vincularBotonTecla(btn, k);
        });

        // Botón Sillazo
        const btnChair = document.getElementById("btnTouchChair");
        if (btnChair) {
          btnChair.addEventListener("pointerdown", e => {
            if (e.cancelable) e.preventDefault();
            initAudio();
            btnChair.classList.add("active");
            if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) { }

            if (estado === "intro") reiniciar();
            else if (estado === "fin") estado = "intro";
            else if (estado === "play" && cuentaRegresiva <= 0.6 && heroe.silla.fase === "reposo") {
              heroe.silla.fase = "carga";
              heroe.silla.t = 0;
              heroe.silla.golpeados.clear();
            }
          }, { passive: false });

          const liberarChair = (e) => {
            if (e.cancelable) e.preventDefault();
            btnChair.classList.remove("active");
          };
          btnChair.addEventListener("pointerup", liberarChair, { passive: false });
          btnChair.addEventListener("pointercancel", liberarChair, { passive: false });
        }

        // Botón Impulso / Dash
        const btnDash = document.getElementById("btnTouchDash");
        if (btnDash) {
          btnDash.addEventListener("pointerdown", e => {
            if (e.cancelable) e.preventDefault();
            initAudio();
            btnDash.classList.add("active");
            if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) { }

            if (estado === "play" && cuentaRegresiva <= 0.6 && heroe.dash <= 0) {
              let vx = heroe.vx, vy = heroe.vy;
              const m = Math.hypot(vx, vy);
              if (m > 20) {
                heroe.vx += (vx / m) * 430;
                heroe.vy += (vy / m) * 430;
              } else {
                heroe.vx += heroe.mirando * 430;
              }
              heroe.dash = 0.75;
              sonidoDash();
            }
          }, { passive: false });

          const liberarDash = (e) => {
            if (e.cancelable) e.preventDefault();
            btnDash.classList.remove("active");
          };
          btnDash.addEventListener("pointerup", liberarDash, { passive: false });
          btnDash.addEventListener("pointercancel", liberarDash, { passive: false });
        }

        // Botones de Sistema
        const btnStart = document.getElementById("btnTouchStart");
        if (btnStart) {
          btnStart.addEventListener("pointerdown", e => {
            if (e.cancelable) e.preventDefault();
            initAudio();
            btnStart.classList.add("active");
            if (estado === "intro") reiniciar();
            else if (estado === "fin") estado = "intro";
          }, { passive: false });
          btnStart.addEventListener("pointerup", () => btnStart.classList.remove("active"));
          btnStart.addEventListener("pointercancel", () => btnStart.classList.remove("active"));
        }

        const btnReset = document.getElementById("btnTouchReset");
        if (btnReset) {
          btnReset.addEventListener("pointerdown", e => {
            if (e.cancelable) e.preventDefault();
            initAudio();
            btnReset.classList.add("active");
            reiniciar();
          }, { passive: false });
          btnReset.addEventListener("pointerup", () => btnReset.classList.remove("active"));
          btnReset.addEventListener("pointercancel", () => btnReset.classList.remove("active"));
        }
      }

      configurarControlesTactiles();
      requestAnimationFrame(bucle);
    })();
  </script>
  <script defer data-domain="andresgldev.github.io" src="https://estadisticas.runacode.com/js/script.js"></script>
